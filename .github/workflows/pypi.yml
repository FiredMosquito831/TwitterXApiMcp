name: pypi

# Publishes the launcher package in pip/ using PyPI trusted publishing (OIDC).
# The wheel vendors the Node.js bundles, so it must be built after
# `npm run package:build`.
#
# One-time setup on pypi.org: project x-mcp-automation -> Publishing ->
# Add a trusted publisher -> GitHub -> owner FiredMosquito831,
# repo TwitterXApiMcp, workflow pypi.yml, environment pypi.
# Then enable publishing for this repository:
#   gh variable set PUBLISH_PYPI --body true

on:
  push:
    branches: [main]
    paths: ["pip/**", "packages/**", "scripts/build-npm.mjs", ".github/workflows/pypi.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workspace dependencies
        run: npm ci

      - name: Build the bundled package and vendor it into pip/
        run: npm run package:build

      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build pip

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: pip/dist/

  publish:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
