name: pypi

# Builds the wheel for every relevant change and publishes it when the
# repository variable PUBLISH_PYPI is "true".
#
# Publishing is opt-in because PyPI has no safe "warn and stay green" path:
# an unconfigured trusted publisher is a hard failure. After configuring it:
#   gh variable set PUBLISH_PYPI --body true
#
# One-time setup on pypi.org: project x-mcp-automation -> Publishing ->
# Add a trusted publisher -> GitHub, exactly:
#   Owner:              FiredMosquito831
#   Repository:         TwitterXApiMcp
#   Workflow filename:  pypi.yml
#   Environment:        (leave EMPTY)
#
# The wheel is built from the tag, never from a developer machine, and is
# attached to the GitHub release so offline installs have an artifact.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "pip/**"
      - "packages/**"
      - "scripts/build-npm.mjs"
      - ".github/workflows/pypi.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.1.0
        required: false

permissions:
  contents: write

concurrency:
  group: pypi-build-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workspace dependencies
        run: npm ci

      - name: Build the bundled package and vendor it into pip/
        run: npm run package:build

      - name: Check that the tag and every manifest agree
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -n "$TAG" ]; then
            TAG="$TAG" node scripts/verify-versions.mjs
          else
            node scripts/verify-versions.mjs
          fi

      - name: Build the wheel (no sdist, by design)
        run: |
          python -m pip install --upgrade build
          python -m build --wheel pip

      - name: Install the wheel in a clean environment and smoke it
        run: |
          python -m venv /tmp/xctl-wheel
          /tmp/xctl-wheel/bin/pip install pip/dist/*.whl
          test "$(/tmp/xctl-wheel/bin/xctl ops | wc -l)" -eq 49
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 20 /tmp/xctl-wheel/bin/xctl-mcp | grep -q '"protocolVersion"'

      - name: Attach the wheel to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" pip/dist/*.whl --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: pip/dist/*.whl

  publish:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/

      - name: Check whether this version already exists
        id: check
        run: |
          VERSION=$(python -c "import zipfile,glob,re; w=glob.glob('dist/*.whl')[0]; print(re.search(r'-(\d+\.\d+\.\d+)-', w).group(1))")
          if curl -sf "https://pypi.org/pypi/x-mcp-automation/$VERSION/json" > /dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "x-mcp-automation $VERSION is already on PyPI."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.check.outputs.skip != 'true'
        with:
          packages-dir: dist/
