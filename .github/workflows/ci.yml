name: ci

# Ordinary pull-request CI. It catches the mistakes that would otherwise fail
# at release time: version drift between npm, PyPI, plugin and marketplace,
# a registry or annotation regression, or a wheel that does not actually run.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Tests, registry checks and version contract
        run: npm test

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npm run package:build

      - name: Version contract
        run: node scripts/verify-versions.mjs

      - name: Inspect the npm tarball
        working-directory: npm
        run: |
          npm pack --dry-run
          test -f dist/cli.mjs
          test -f dist/mcp.mjs

      - name: Inspect and smoke the wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel pip
          python -m venv /tmp/xctl-ci
          /tmp/xctl-ci/bin/pip install pip/dist/*.whl
          test "$(/tmp/xctl-ci/bin/xctl ops | wc -l)" -eq 49
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 20 /tmp/xctl-ci/bin/xctl-mcp | grep -q '"protocolVersion"'

      - name: The plugin must carry its own server
        run: test -f plugins/xctl/servers/xctl.mjs
