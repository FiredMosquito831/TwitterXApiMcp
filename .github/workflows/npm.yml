name: npm

# Publishes x-mcp-automation to npm in two situations:
#   1. a GitHub release is published (the tag must match npm/package.json), or
#   2. npm/package.json is pushed to main with a version that is not on npm yet.
# A manual run can publish an existing tag.
#
# One-time setup on npmjs.com: package x-mcp-automation -> Settings ->
# Trusted Publisher -> GitHub Actions, exactly:
#   Organization or user: FiredMosquito831
#   Repository:           TwitterXApiMcp
#   Workflow filename:    npm.yml
#   Environment:          (leave EMPTY)
#
# Until that is configured the publish step prints a warning and the run stays
# green; once configured, the next release or version bump publishes for real.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "npm/package.json"
      - ".github/workflows/npm.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v0.1.0
        required: false

permissions:
  contents: read
  id-token: write

# One publish per tag/ref, never cancelled: an interrupted publish is not idempotent.
concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install workspace dependencies
        run: npm ci

      - name: Build the bundled package and plugin server
        run: npm run package:build

      - name: Check that the tag and every manifest agree
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -n "$TAG" ]; then
            TAG="$TAG" node scripts/verify-versions.mjs
          else
            node scripts/verify-versions.mjs
          fi

      - name: Use a recent npm (trusted publishing needs 11.5.1+)
        run: npm install -g npm@latest

      - name: Publish the version if it is new
        working-directory: npm
        run: |
          set -o pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; nothing to publish."
            exit 0
          fi

          set +e
          npm publish --provenance --access public 2>&1 | tee publish.log
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            if grep -qiE "ENEEDAUTH|EOTP|not authorized|trusted publisher|403" publish.log; then
              echo "::warning title=npm trusted publisher not configured::Configure it on npmjs.com (owner FiredMosquito831, repo TwitterXApiMcp, workflow npm.yml, environment empty), then re-run this workflow."
              exit 0
            fi
            exit "$STATUS"
          fi

      - name: Report the published version
        if: success()
        working-directory: npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          # The registry can lag the publish response by a minute or two.
          for attempt in 1 2 3 4 5 6; do
            if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
              echo "$NAME@$VERSION is live on npm."
              exit 0
            fi
            sleep 10
          done
          echo "::warning title=Not on npm::The workflow finished but $NAME@$VERSION is not on npm after 60 seconds. Check the publish log above."
